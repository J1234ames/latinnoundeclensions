<!DOCTYPE html>
<html>
<head>

    <title>Latin</title>

<style>
    * {
    font-family: Calibri;
    }
    .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    }
    .container div:nth-child(odd) {
    margin-top: 50px;
    }
    table.declen th, table.declen td {
    padding: 10px;
    }
    table.declen tr:nth-child(odd) {
    background-color:rgb(240,240,240)
    }
    table.declen tr:nth-child(even) {
    background-color:rgb(200,230,250)
    }
    table.declen tr:nth-child(1) th:nth-child(1) {
    visibility:collapse;
    width:100px 
    }
    table.declen tr:nth-child(1) th:nth-child(2) {
    width:75px;
    border-radius:5px 0 0 0
    }
    table.declen tr:nth-child(1) th:nth-child(3) {
    width:75px;
    border-radius:0 5px 0 0;
    }
    table.declen tr:nth-child(2) th:nth-child(1) {
    width:75px;
    border-radius:5px 0 0 0;
    }
    table.declen tr:nth-child(6) th:nth-child(1) {
    width:75px;
    border-radius:0 0 0 5px;
    }
    table.declen tr:nth-child(6) td:nth-child(3) {
    width:75px;
    border-radius:0 0 5px 0;
    }
</style>
</head>

<header><h1 style="text-align: center">Latin Noun Endings</h1></header>

<div class="container">

<div>
<table class="declen">

  </tr>

</table>
</div>

</div>
